<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talk With Me</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      background: #1e293b;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: #38bdf8; }
    p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 24px; }
    .gen-btn {
      width: 100%;
      padding: 12px;
      background: #10b981;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .divider {
      display: flex;
      align-items: center;
      color: #64748b;
      font-size: 0.8rem;
      margin: 10px 0 20px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #334155;
    }
    .divider::before { margin-right: 10px; }
    .divider::after { margin-left: 10px; }
    .form-group { text-align: left; }
    label { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; display: block; }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
    }
    .start-btn {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      border: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Talk With Me</h1>
    <p>Private 1-on-1 Call • Zero Accounts</p>
    <button class="gen-btn" onclick="generateCode()">Generate 9-Digit Code</button>
    <div class="divider">OR JOIN WITH CODE</div>
    <div class="form-group">
      <label for="codeBox">Enter 9-Digit Room Code:</label>
      <input type="text" id="codeBox" placeholder="123456789" maxlength="9" />
      <button class="start-btn" onclick="startCall()">Join Live Call</button>
    </div>
  </div>

  <script>
    function generateCode() {
      const randomCode = Math.floor(100000000 + Math.random() * 900000000).toString();
      document.getElementById("codeBox").value = randomCode;
    }

    function startCall() {
      const code = document.getElementById("codeBox").value.trim().replace(/\s+/g, '');
      if (!code || code.length !== 9 || isNaN(code)) {
        alert("Please enter a valid 9-digit numerical code!");
        return;
      }
      window.location.href = `https://huzaifafaraz67-sketch.github.io/b3e0Kh/?room=${code}`;
    }
  </script>
</body>
</html>
