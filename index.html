<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talk With Me</title>
  <!-- Google Identity Services Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      background: #1e293b;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .user-badge {
      display: none;
      background: #334155;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: #e2e8f0;
      word-break: break-all;
    }
    .google-btn-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .form-group {
      display: none;
      text-align: left;
    }
    label {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 6px;
      display: block;
    }
    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 16px;
    }
    input[type="email"]:focus {
      border-color: #38bdf8;
    }
    .start-btn {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      border: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .start-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Talk With Me</h1>
    <p>Sign in to start a private 1-on-1 direct call.</p>

    <!-- Google Sign-In Button Container -->
    <div class="google-btn-container" id="googleBtnWrapper">
      <div id="g_id_onload"
           data-client_id="talk-with-me-510116.apps.googleusercontent.com"
           data-callback="handleCredentialResponse">
      </div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="dark"></div>
    </div>

    <!-- Active User Card -->
    <div class="user-badge" id="userBadge"></div>

    <!-- Call Form (Visible after Login) -->
    <div class="form-group" id="callForm">
      <label for="peerEmail">Enter the recipient's Email:</label>
      <input type="email" id="peerEmail" placeholder="friend@gmail.com" required />
      <button class="start-btn" onclick="initiateCall()">Start Live Call</button>
    </div>
  </div>

  <script>
    let loggedInUserEmail = "";

    // Helper: Safely decode JWT Google Credential Token
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    // Google Auth Callback
    function handleCredentialResponse(response) {
      const userData = parseJwt(response.credential);
      if (userData && userData.email) {
        loggedInUserEmail = userData.email;

        // Update UI
        document.getElementById("googleBtnWrapper").style.display = "none";
        const badge = document.getElementById("userBadge");
        badge.innerText = `Logged in as: ${loggedInUserEmail}`;
        badge.style.display = "block";
        document.getElementById("callForm").style.display = "block";
      }
    }

    // Call Button Action
    function initiateCall() {
      const targetEmail = document.getElementById("peerEmail").value.trim().toLowerCase();

      if (!targetEmail) {
        alert("Please enter the email address of the person you want to talk to.");
        return;
      }

      if (targetEmail === loggedInUserEmail.toLowerCase()) {
        alert("You cannot enter your own email!");
        return;
      }

      // Sort both emails alphabetically to generate the EXACT same room name for both callers
      const emails = [loggedInUserEmail.toLowerCase(), targetEmail].sort();
      const roomId = btoa(`${emails[0]}_${emails[1]}`).replace(/=/g, '');

      // Redirect to b3e0Kh signaling engine with room ID and caller identity
      window.location.href = `https://huzaifafaraz67-sketch.github.io/b3e0Kh/?room=${roomId}&user=${encodeURIComponent(loggedInUserEmail)}`;
    }
  </script>
</body>
</html>
